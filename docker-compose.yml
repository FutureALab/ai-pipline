services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-ai_pipeline}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-ai_pipeline}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: ai-pipeline-mysql
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_pipeline}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis-master:
    image: redis:7-alpine
    container_name: ai-pipeline-redis-master
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    container_name: ai-pipeline-redis-replica
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_replica_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: ai-pipeline-redis-sentinel-1
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    ports:
      - "26379:26379"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<EOF > /tmp/sentinel.conf
        port 26379
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor ${REDIS_SENTINEL_MASTER:-mymaster} redis-master 6379 2
        sentinel down-after-milliseconds ${REDIS_SENTINEL_MASTER:-mymaster} 5000
        sentinel failover-timeout ${REDIS_SENTINEL_MASTER:-mymaster} 10000
        sentinel parallel-syncs ${REDIS_SENTINEL_MASTER:-mymaster} 1
        EOF
        exec redis-sentinel /tmp/sentinel.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: ai-pipeline-redis-sentinel-2
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    ports:
      - "26380:26379"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<EOF > /tmp/sentinel.conf
        port 26379
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor ${REDIS_SENTINEL_MASTER:-mymaster} redis-master 6379 2
        sentinel down-after-milliseconds ${REDIS_SENTINEL_MASTER:-mymaster} 5000
        sentinel failover-timeout ${REDIS_SENTINEL_MASTER:-mymaster} 10000
        sentinel parallel-syncs ${REDIS_SENTINEL_MASTER:-mymaster} 1
        EOF
        exec redis-sentinel /tmp/sentinel.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: ai-pipeline-redis-sentinel-3
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    ports:
      - "26381:26379"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<EOF > /tmp/sentinel.conf
        port 26379
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor ${REDIS_SENTINEL_MASTER:-mymaster} redis-master 6379 2
        sentinel down-after-milliseconds ${REDIS_SENTINEL_MASTER:-mymaster} 5000
        sentinel failover-timeout ${REDIS_SENTINEL_MASTER:-mymaster} 10000
        sentinel parallel-syncs ${REDIS_SENTINEL_MASTER:-mymaster} 1
        EOF
        exec redis-sentinel /tmp/sentinel.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: ai-pipeline-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP/Protobuf (对应 .env 中的 OTEL_EXPORTER_OTLP_TRACES_ENDPOINT)

  jenkins:
    build:
      context: ./docker/jenkins
    image: ai-pipeline-jenkins:lts-jdk17
    container_name: ai-pipeline-jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "50000:50000"
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_PASSWORD:-admin123}
      # Pass through OpenAI / OMP runtime env so bundled ai-pipeline binary in Jenkins
      # runs with the exact same model config as local & creative mode
      OMP_MODEL: ${OMP_MODEL:-}
      OPENAI_API_MODE: ${OPENAI_API_MODE:-chat}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL_NAME: ${OPENAI_MODEL_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_BASE_URL: ${OPENAI_CHAT_BASE_URL:-}
      OPENAI_CHAT_MODEL_NAME: ${OPENAI_CHAT_MODEL_NAME:-}
      OPENAI_CHAT_API_KEY: ${OPENAI_CHAT_API_KEY:-}
      OPENAI_RESPONSES_BASE_URL: ${OPENAI_RESPONSES_BASE_URL:-}
      OPENAI_RESPONSES_MODEL_NAME: ${OPENAI_RESPONSES_MODEL_NAME:-}
      OPENAI_RESPONSES_API_KEY: ${OPENAI_RESPONSES_API_KEY:-}
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount compiled Linux binaries (arm64 for Apple Silicon Docker, x64 for Intel/Linux)
      - ./dist/bin/linux-arm64:/opt/ai-pipeline-bin/arm64:ro
      - ./dist/bin/linux-x64:/opt/ai-pipeline-bin/x64:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  postgres_data:
  mysql_data:
  redis_master_data:
  redis_replica_data:
  jenkins_home:
